<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação 360° · CJ Home Center</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#3787B8; --azul-esc:#2A6C94; --azul-cl:#EAF3F9;
    --verde:#10822F; --verde-cl:#E7F4EA; --verde-med:#36A862;
    --cinza:#5B5B5B; --texto:#2B2F33; --suave:#6B7280; --borda:#E3E7EB;
    --fundo:#F5F7F9; --branco:#fff; --erro:#C2410C; --erro-cl:#FFF1EB;
    --raio:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{background:var(--branco);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:10}
  .top{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top svg{height:38px;width:auto;display:block}
  .tag{font-size:12px;font-weight:600;color:var(--azul);background:var(--azul-cl);padding:4px 10px;border-radius:99px;white-space:nowrap}
  .barra{height:4px;background:var(--borda)}
  .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul),var(--verde));transition:width .35s ease}
  main{max-width:680px;margin:0 auto;padding:20px 16px 120px}
  .card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio);padding:22px 20px;margin-bottom:14px}
  h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-weight:800;color:var(--texto)}
  h2{font-size:19px;margin:0 0 4px;font-weight:700}
  .etapa{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);margin-bottom:6px}
  .sub{color:var(--suave);margin:0 0 4px;font-size:15px}
  .passos{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
  .passos li{display:flex;gap:12px;align-items:flex-start}
  .passos b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--azul-cl);color:var(--azul);display:grid;place-items:center;font-size:14px}
  .aviso{background:var(--verde-cl);border-radius:12px;padding:14px 16px;font-size:14px;margin-top:16px}
  .aviso strong{color:var(--verde)}
  .dica{font-size:14px;color:var(--suave);margin-top:12px}
  .legenda{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);background:var(--fundo);border-radius:10px;padding:8px 12px;margin:12px 0 2px;gap:8px}
  .q{padding:16px 0;border-top:1px solid var(--borda)}
  .q:first-of-type{border-top:0}
  .q-t{font-weight:700;font-size:15.5px}
  .q-d{font-size:13.5px;color:var(--suave);margin:2px 0 10px}
  .esc{display:flex;gap:6px;flex-wrap:wrap}
  .esc button{font:inherit;font-weight:700;font-size:16px;min-width:44px;height:44px;flex:1 1 44px;border:1.5px solid var(--borda);background:var(--branco);color:var(--texto);border-radius:10px;cursor:pointer;transition:all .15s}
  .esc button:hover{border-color:var(--azul)}
  .esc button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .esc button.ns{flex:1.6 1 72px;font-size:13px;font-weight:600;color:var(--suave)}
  .esc button.ns.on{background:var(--cinza);border-color:var(--cinza);color:#fff}
  .esc.nps button{min-width:38px;flex:1 1 38px;font-size:15px}
  .esc.nps button.on.d{background:#D9534F;border-color:#D9534F}
  .esc.nps button.on.n{background:#E6A23C;border-color:#E6A23C}
  .esc.nps button.on.p{background:var(--verde);border-color:var(--verde)}
  .esc.conc button{font-size:14px}
  .extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);margin-top:6px}
  label.campo{display:block;font-weight:700;font-size:15px;margin:18px 0 4px}
  label.campo .ajuda{display:block;font-weight:500;font-size:13px;color:var(--suave)}
  textarea,input[type=text]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--borda);border-radius:10px;padding:11px 12px;background:var(--branco);color:var(--texto);resize:vertical}
  textarea{min-height:72px}
  textarea:focus,input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-cl)}
  .pos{color:var(--verde)} .neg{color:var(--erro)}
  .invalido{border-radius:12px;background:var(--erro-cl);box-shadow:0 0 0 2px var(--erro-cl);animation:pulse .5s}
  textarea.invalido{border-color:var(--erro);background:var(--erro-cl)}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.01)}100%{transform:scale(1)}}
  .colega{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--verde));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:0 0 48px}
  .rodape{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--borda);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .rodape .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .msg{flex:1;font-size:13px;color:var(--erro);font-weight:600}
  .btn{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:13px 22px;border:0;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.07)}
  .btn.pri{background:var(--verde);color:#fff}
  .btn.sec{background:var(--fundo);color:var(--texto);border:1.5px solid var(--borda)}
  .btn:disabled{opacity:.6;cursor:wait}
  .centro{text-align:center;padding:40px 20px}
  .ok{width:72px;height:72px;border-radius:50%;background:var(--verde-cl);color:var(--verde);display:grid;place-items:center;margin:0 auto 16px;font-size:36px;font-weight:800}
  .spin{width:34px;height:34px;border:3px solid var(--borda);border-top-color:var(--azul);border-radius:50%;margin:30px auto;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .demo{background:#FFF7E0;color:#8A6100;font-size:12px;font-weight:600;text-align:center;padding:6px}
  .cod{display:flex;gap:10px;margin-top:14px}
  .cod input{text-transform:uppercase;letter-spacing:.2em;font-weight:700;text-align:center}
  @media (max-width:420px){ h1{font-size:21px} .esc button{min-width:40px;height:42px} .top svg{height:32px} .card{padding:18px 16px} }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demonstração — nada será enviado</div>
<header>
  <div class="top">
    <svg viewBox="130 320 820 440" role="img" aria-label="CJ Home Center">
      <path fill="#3787B8" d="M352,328 A212,212 0 1,0 501.9,689.9 L465.1,653.1 A160,160 0 1,1 352,380 Z"/>
      <path fill="#10822F" d="M405,335 L457,356 L457,540 A105,105 0 0,1 247,540 L300,540 A52.5,52.5 0 0,0 405,540 Z"/>
      <g style="mix-blend-mode:multiply">
        <polygon fill="#3787B8" points="509,468 596,549 509,630"/>
        <polygon fill="#36A862" points="509,408 596,489 509,570" opacity=".9"/>
        <polygon fill="#10822F" points="509,347 596,429 509,510" opacity=".95"/>
      </g>
      <text x="630" y="470" font-family="Montserrat,sans-serif" font-weight="800" font-size="76" fill="#5B5B5B" letter-spacing="2">HOME</text>
      <text x="628" y="546" font-family="Montserrat,sans-serif" font-weight="300" font-size="76" fill="#5B5B5B" letter-spacing="2">CENTER</text>
    </svg>
    <span class="tag">Avaliação 360°</span>
  </div>
  <div class="barra"><i id="progresso"></i></div>
</header>
<main id="app"><div class="spin"></div></main>
<div class="rodape" id="rodape" hidden>
  <div class="in">
    <button class="btn sec" id="voltar">Voltar</button>
    <div class="msg" id="msg"></div>
    <button class="btn pri" id="avancar">Continuar</button>
  </div>
</div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzwOspQH4EA1jXqMueAai4FOA9wP8rxhqI3GvBpyqk8P8elzYZj8Gbv0z88ErNa33gh/exec'; // termina em /exec
/* ===================================== */

const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo') || !/^https:\/\/script\.google\.com\//.test(API_URL);
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const primeiroNome = n => String(n).split(' ')[0];
const iniciais = n => String(n).split(' ').filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase();

let S = null; // estado

/* ---------- Demonstração ---------- */
const DEMO_INFO = {
  ok:true, nome:'Maria Vitória', jaRespondeu:false, minimo:3,
  avaliados:['Carlos Maykon','Elana Dantas','José Sérgio','Bruno Max','Udo Dirck'],
  competencias:[
    {id:'atendimento',nome:'Atendimento ao cliente',desc:'Recebe bem, escuta e resolve a necessidade do cliente.'},
    {id:'equipe',nome:'Trabalho em equipe',desc:'Colabora, ajuda os colegas e divide responsabilidades.'},
    {id:'comprometimento',nome:'Comprometimento',desc:'É pontual, cumpre o que promete e cuida das suas tarefas.'},
    {id:'comunicacao',nome:'Comunicação',desc:'Se expressa com clareza e respeito e repassa informações.'},
    {id:'proatividade',nome:'Proatividade',desc:'Antecipa problemas e age sem precisar ser cobrado.'},
    {id:'conhecimento',nome:'Conhecimento técnico',desc:'Domina produtos, processos e sistemas da loja.'}],
  itensEmpresa:[
    {id:'orgulho',texto:'Tenho orgulho de trabalhar na CJ Home Center.'},
    {id:'clareza',texto:'Sei claramente o que se espera do meu trabalho.'},
    {id:'comunicacao',texto:'A comunicação entre liderança e equipe funciona bem.'},
    {id:'reconhecimento',texto:'Me sinto reconhecido(a) pelo trabalho que faço.'}]
};

/* ---------- API ---------- */
async function apiInicio(codigo){
  if (DEMO) { await new Promise(r=>setTimeout(r,400)); return DEMO_INFO; }
  const r = await fetch(API_URL + '?acao=inicio&codigo=' + encodeURIComponent(codigo));
  return r.json();
}
async function apiEnviar(payload){
  if (DEMO) { await new Promise(r=>setTimeout(r,900)); return {ok:true}; }
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
  return r.json();
}

/* ---------- Rascunho local ---------- */
const chave = () => 'cj360_' + S.codigo;
function salvarRascunho(){ try{ localStorage.setItem(chave(), JSON.stringify({passo:S.passo, resp:S.resp})); }catch(e){} }
function lerRascunho(){ try{ return JSON.parse(localStorage.getItem(chave())||'null'); }catch(e){ return null; } }
function apagarRascunho(){ try{ localStorage.removeItem(chave()); }catch(e){} }

/* ---------- Início ---------- */
async function iniciar(codigo){
  app.innerHTML = '<div class="spin"></div>';
  try{
    const info = await apiInicio(codigo);
    if (!info.ok) return telaCodigo(info.erro);
    if (info.jaRespondeu) return telaMensagem('✓','Avaliação já registrada','Sua participação já foi recebida. Muito obrigado por contribuir!');
    S = { codigo:String(codigo).toUpperCase(), info, passo:0, resp:{
      auto:{notas:{}, forte:'', melhoria:''},
      aval:Object.fromEntries(info.avaliados.map(n=>[n,{notas:{}, continuar:'', melhorar:''}])),
      empresa:{enps:null, itens:{}, melhor:'', mudar:''}
    }};
    const r = lerRascunho();
    if (r && r.resp && r.resp.aval && Object.keys(r.resp.aval).join()===Object.keys(S.resp.aval).join()) { S.resp = r.resp; S.passo = r.passo||0; }
    S.passos = ['intro','auto', ...info.avaliados.map((_,i)=>'colega'+i), 'empresa'];
    render();
  }catch(e){
    telaCodigo('Não foi possível conectar. Verifique sua internet e tente novamente.');
  }
}

function telaCodigo(erro){
  $('#rodape').hidden = true;
  app.innerHTML = `<div class="card">
    <div class="etapa">Avaliação 360° · CJ Home Center</div>
    <h1>Digite seu código de acesso</h1>
    <p class="sub">Você recebeu um código individual de 6 caracteres junto com o link.</p>
    <form class="cod" id="fcod"><input type="text" id="icod" maxlength="6" autocomplete="off" placeholder="ABC123" aria-label="Código de acesso"><button class="btn pri">Entrar</button></form>
    ${erro?`<p class="msg" style="margin-top:12px">${esc(erro)}</p>`:''}
  </div>`;
  $('#fcod').onsubmit = ev => { ev.preventDefault(); const c = $('#icod').value.trim(); if (c) { history.replaceState(null,'','?c='+encodeURIComponent(c.toUpperCase())+(DEMO&&qs.has('demo')?'&demo':'')); iniciar(c); } };
}

function telaMensagem(icone, titulo, texto){
  $('#rodape').hidden = true;
  $('#progresso').style.width = '100%';
  app.innerHTML = `<div class="card centro"><div class="ok">${icone}</div><h1>${esc(titulo)}</h1><p class="sub">${esc(texto)}</p></div>`;
}

/* ---------- Componentes ---------- */
function get(path){ return path.split('.').reduce((o,k)=>o==null?o:o[k], S.resp); }
function set(path, v){ const ks = path.split('.'); const last = ks.pop(); ks.reduce((o,k)=>o[k], S.resp)[last] = v; salvarRascunho(); }

function escala(path, opts){
  const v = get(path);
  const {min=1,max=5,naoSei=false,classe='',rot=null} = opts||{};
  let h = `<div class="esc ${classe}" data-path="${esc(path)}">`;
  for (let n=min;n<=max;n++){
    const cls = classe==='nps' ? (n<=6?'d':n<=8?'n':'p') : '';
    h += `<button type="button" class="${cls} ${v===n?'on':''}" data-v="${n}" aria-label="${rot?esc(rot[n-min]):n}">${n}</button>`;
  }
  if (naoSei) h += `<button type="button" class="ns ${v===0?'on':''}" data-v="0">Não sei</button>`;
  return h + '</div>';
}
function competencias(base){
  return S.info.competencias.map(c => `<div class="q" id="q-${esc(base+'.'+c.id).replace(/[^\w-]/g,'_')}" data-req="${esc(base+'.'+c.id)}">
    <div class="q-t">${esc(c.nome)}</div><div class="q-d">${esc(c.desc)}</div>
    ${escala(base+'.'+c.id,{naoSei:true})}
  </div>`).join('');
}
function campo(path, rotulo, ajuda, placeholder, obrig=true){
  return `<label class="campo">${rotulo}${ajuda?`<span class="ajuda">${ajuda}</span>`:''}</label>
  <textarea data-path="${esc(path)}" ${obrig?`data-req="${esc(path)}"`:''} maxlength="600" placeholder="${esc(placeholder)}">${esc(get(path)||'')}</textarea>`;
}
const LEGENDA = `<div class="legenda"><span><b>1</b> Muito abaixo</span><span><b>3</b> Adequado</span><span><b>5</b> Excelente</span></div>`;

/* ---------- Telas ---------- */
function render(){
  const p = S.passos[S.passo];
  const total = S.passos.length - 1;
  $('#progresso').style.width = (S.passo/ (total+1) * 100) + '%';
  $('#rodape').hidden = false;
  $('#voltar').style.visibility = S.passo===0 ? 'hidden':'visible';
  $('#avancar').textContent = p==='intro' ? 'Começar' : (p==='empresa' ? 'Enviar avaliação' : 'Continuar');
  $('#msg').textContent = '';
  const etapa = n => `<div class="etapa">Etapa ${n} de 3</div>`;
  const nAval = S.info.avaliados.length;

  if (p==='intro'){
    app.innerHTML = `<div class="card">
      <h1>Olá, ${esc(primeiroNome(S.info.nome))}!</h1>
      <p class="sub">Esta avaliação ajuda cada pessoa da equipe — e a CJ — a crescer. Leva cerca de <b>10 minutos</b>.</p>
      <ul class="passos">
        <li><b>1</b><div><strong>Você se avalia</strong><br><span class="sub">Como você enxerga o seu próprio trabalho.</span></div></li>
        <li><b>2</b><div><strong>Você avalia ${nAval} colegas</strong><br><span class="sub">Sorteados para que todos recebam o mesmo número de avaliações.</span></div></li>
        <li><b>3</b><div><strong>Você fala sobre a CJ</strong><br><span class="sub">O que funciona e o que precisa mudar.</span></div></li>
      </ul>
      <div class="aviso"><strong>Suas respostas são confidenciais.</strong> Não registramos quem escreveu cada avaliação sobre colegas ou sobre a empresa, e os resultados só aparecem agrupados (mínimo de ${S.info.minimo||3} avaliações por pessoa).</div>
      <p class="dica">Dica: seja específico e respeitoso. Fale de atitudes, não da pessoa — "ajuda os colegas quando a loja enche" vale mais que "é legal".</p>
    </div>`;
  }
  else if (p==='auto'){
    app.innerHTML = `<div class="card">${etapa(1)}
      <h2>Sua autoavaliação</h2><p class="sub">Responda com sinceridade: como você avalia seu desempenho hoje?</p>
      ${LEGENDA}${competencias('auto.notas')}
      ${campo('auto.forte','<span class="pos">●</span> Meu maior ponto forte','Uma qualidade que você traz para a equipe.','Ex.: Conheço bem os porcelanatos e consigo orientar o cliente na escolha.')}
      ${campo('auto.melhoria','<span class="neg">●</span> Onde preciso melhorar','Algo que você gostaria de desenvolver.','Ex.: Preciso registrar melhor os pedidos no sistema.')}
    </div>`;
  }
  else if (p.startsWith('colega')){
    const i = Number(p.slice(6)); const nome = S.info.avaliados[i]; const b = 'aval.'+nome;
    app.innerHTML = `<div class="card">${etapa(2)} <span class="sub" style="font-size:13px">· colega ${i+1} de ${nAval}</span>
      <div class="colega" style="margin-top:10px"><div class="avatar">${esc(iniciais(nome))}</div><div><h2>${esc(nome)}</h2><p class="sub" style="margin:0">Pense no dia a dia de trabalho com essa pessoa.</p></div></div>
      ${LEGENDA}${competencias(b+'.notas')}
      ${campo(b+'.continuar','<span class="pos">●</span> Continue fazendo','O que essa pessoa faz bem e deve manter.','Ex.: Sempre ajuda no atendimento quando a loja está cheia.')}
      ${campo(b+'.melhorar','<span class="neg">●</span> Pode melhorar','Um comportamento concreto que faria diferença. Seja construtivo.','Ex.: Avisar com antecedência quando for se atrasar.')}
    </div>`;
  }
  else if (p==='empresa'){
    const rotC = ['Discordo totalmente','Discordo','Neutro','Concordo','Concordo totalmente'];
    app.innerHTML = `<div class="card">${etapa(3)}
      <h2>Sobre a CJ Home Center</h2><p class="sub">Esta parte é 100% anônima.</p>
      <div class="q" data-req="empresa.enps"><div class="q-t">De 0 a 10, o quanto você recomendaria a CJ como um bom lugar para trabalhar?</div>
        <div style="margin-top:10px">${escala('empresa.enps',{min:0,max:10,classe:'nps'})}</div>
        <div class="extremos"><span>Nada provável</span><span>Muito provável</span></div></div>
      ${S.info.itensEmpresa.map(it=>`<div class="q" data-req="empresa.itens.${esc(it.id)}"><div class="q-t">${esc(it.texto)}</div>
        <div style="margin-top:10px">${escala('empresa.itens.'+it.id,{classe:'conc',rot:rotC})}</div>
        <div class="extremos"><span>Discordo totalmente</span><span>Concordo totalmente</span></div></div>`).join('')}
      ${campo('empresa.melhor','O que a CJ faz de melhor?','Opcional','Ex.: O ambiente entre a equipe é muito bom.',false)}
      ${campo('empresa.mudar','O que a CJ deveria mudar já?','Opcional','Ex.: Ter metas mais claras para cada setor.',false)}
    </div>`;
  }
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- Interações ---------- */
app.addEventListener('click', ev => {
  const b = ev.target.closest('.esc button'); if (!b) return;
  const g = b.parentElement; const v = Number(b.dataset.v);
  set(g.dataset.path, v);
  g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  const q = g.closest('[data-req]'); if (q) q.classList.remove('invalido');
});
app.addEventListener('input', ev => {
  const t = ev.target; if (t.tagName!=='TEXTAREA' || !t.dataset.path) return;
  set(t.dataset.path, t.value); t.classList.remove('invalido');
});

function validar(){
  const pend = [...app.querySelectorAll('[data-req]')].filter(el => {
    const v = get(el.dataset.req);
    return el.tagName==='TEXTAREA' ? String(v||'').trim().length < 3 : (v===undefined || v===null || v==='');
  });
  app.querySelectorAll('.invalido').forEach(e=>e.classList.remove('invalido'));
  if (pend.length){
    pend.forEach(e=>e.classList.add('invalido'));
    pend[0].scrollIntoView({behavior:'smooth',block:'center'});
    $('#msg').textContent = pend.length===1 ? 'Falta 1 resposta.' : `Faltam ${pend.length} respostas.`;
    return false;
  }
  return true;
}

$('#voltar').onclick = () => { if (S.passo>0){ S.passo--; salvarRascunho(); render(); } };
$('#avancar').onclick = async () => {
  if (!validar()) return;
  if (S.passo < S.passos.length-1){ S.passo++; salvarRascunho(); render(); return; }
  const btn = $('#avancar'); btn.disabled = true; btn.textContent = 'Enviando…'; $('#msg').textContent='';
  const R = S.resp;
  const payload = {
    codigo:S.codigo,
    auto:R.auto,
    avaliacoes:S.info.avaliados.map(n=>({avaliado:n, notas:R.aval[n].notas, continuar:R.aval[n].continuar, melhorar:R.aval[n].melhorar})),
    empresa:R.empresa
  };
  try{
    const r = await apiEnviar(payload);
    if (!r.ok) throw new Error(r.erro||'Erro ao enviar.');
    apagarRascunho();
    telaMensagem('✓','Avaliação enviada!','Obrigado, '+primeiroNome(S.info.nome)+'. Sua contribuição ajuda toda a equipe da CJ Home Center a crescer.');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Tentar novamente';
    $('#msg').textContent = e.message && e.message!=='Failed to fetch' ? e.message : 'Falha de conexão. Suas respostas estão salvas — tente de novo.';
  }
};

/* ---------- Boot ---------- */
if (DEMO) $('#demo').hidden = false;
const codigoUrl = (qs.get('c')||'').trim();
if (codigoUrl) iniciar(codigoUrl);
else if (DEMO) iniciar('DEMO01');
else telaCodigo();
</script>
</body>
</html>
